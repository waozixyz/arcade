plugins {
    id 'com.android.application'
}

// kryon build --profile android passes the checkouts through the environment;
// a plain gradle invocation can pass the same values as properties.
def envOrProp = { String envName, String propName ->
    System.getenv(envName) ?: project.findProperty(propName)
}
def kryonDir = envOrProp('KRYON_DIR', 'kryon.dir')
def ziranDir = envOrProp('ZIRAN_DIR', 'ziran.dir')
def raylibDir = envOrProp('RAYLIB_DIR', 'raylib.dir')
if (kryonDir == null || ziranDir == null || raylibDir == null) {
    throw new GradleException(
        'Pass -Pkryon.dir=... -Pziran.dir=... -Praylib.dir=... ' +
        'or build through kryon build --profile android')
}
def androidAbis = (project.findProperty('app.abis') ?:
    System.getenv('KRYON_ANDROID_ABIS') ?: 'arm64-v8a').split(',').toList()
def standaloneShovey = project.findProperty('app.product') == 'shovey'
def ledger = new groovy.json.JsonSlurper().parse(file('../../apps/versions.json'))
def appRelease = ledger.node_apps[standaloneShovey ? 'shovey' : 'arcade']

def appCodegen = envOrProp('KRYON_PROJECT_CODEGEN', 'app.codegen') ?: 'c99'

android {
    namespace 'xyz.waozi.arcade'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId project.findProperty('app.id') ?: (standaloneShovey ? 'xyz.waozi.shovey' : 'xyz.waozi.arcade')
        minSdk Integer.parseInt((project.findProperty('app.minSdk') ?: '21').toString())
        targetSdk 36
        versionCode Integer.parseInt((project.findProperty('app.versionCode') ?: appRelease.sequence).toString())
        versionName project.findProperty('app.versionName') ?: appRelease.version
        manifestPlaceholders = [appLabel: standaloneShovey ? 'Shovey' : 'Arcade', appIcon: standaloneShovey ? '@mipmap/ic_launcher' : '@android:drawable/sym_def_app_icon', zibPlayer: (appCodegen == 'zib').toString(),
            nativeLaunchMode: appCodegen == 'zib' ? 'singleTask' : 'standard']
        ndk {
            abiFilters += androidAbis
        }
        externalNativeBuild {
            cmake {
                arguments '-DKRYON_DIR=' + kryonDir,
                    '-DZIRAN_DIR=' + ziranDir,
                    '-DRAYLIB_DIR=' + raylibDir,
                    '-DAPP_CODEGEN=' + appCodegen,
                    '-DSHOVEY_STANDALONE=' + (standaloneShovey ? 'ON' : 'OFF')
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // Arcade's collection and receipt, staged by make android.
    sourceSets.main.assets.srcDir "${rootProject.projectDir}/../build/${standaloneShovey ? 'android-shovey-assets' : 'android-assets'}"
    if (standaloneShovey) {
        sourceSets.main.res.srcDir "${rootProject.projectDir}/../build/android-shovey-res"
    }

    if (appCodegen == 'zib') {
        sourceSets.main.assets.srcDir "${rootProject.projectDir}/../build/android/zib-assets"
        sourceSets.debug.manifest.srcFile 'src/zib/AndroidManifest.xml'
        sourceSets.release.manifest.srcFile 'src/zib/AndroidManifest.xml'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
