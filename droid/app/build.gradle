plugins {
    id 'com.android.application'
}

// kryon build --profile android passes the checkouts through the environment;
// a plain gradle invocation can pass the same values as properties.
def envOrProp = { String envName, String propName ->
    System.getenv(envName) ?: project.findProperty(propName)
}
def kryonDir = envOrProp('KRYON_DIR', 'kryon.dir')
def ziranDir = envOrProp('ZIRAN_DIR', 'ziran.dir')
def raylibDir = envOrProp('RAYLIB_DIR', 'raylib.dir')
if (kryonDir == null || ziranDir == null || raylibDir == null) {
    throw new GradleException(
        'Pass -Pkryon.dir=... -Pziran.dir=... -Praylib.dir=... ' +
        'or build through kryon build --profile android')
}
def androidAbis = (project.findProperty('app.abis') ?:
    System.getenv('KRYON_ANDROID_ABIS') ?: 'arm64-v8a').split(',').toList()
def standaloneShovey = project.findProperty('app.product') == 'shovey'
def ledger = new groovy.json.JsonSlurper().parse(file('../../apps/versions.json'))
def appRelease = ledger.node_apps[standaloneShovey ? 'shovey' : 'arcade']

def appCodegen = envOrProp('KRYON_PROJECT_CODEGEN', 'app.codegen') ?: 'c99'
// Kryon's three editions: -Papp.edition=direct (the default), fdroid or gplay.
// The Google Play edition adds Kryon's Play Billing (kryon/play_billing), so
// Entity sells Dew through Google Play; it needs Android 6 and AndroidX
// (-Pandroid.useAndroidX=true). Native code sees GOOGLE_PLAY or FDROID.
def appEdition = (project.findProperty('app.edition') ?:
    (project.findProperty('app.googlePlay') == 'true' ? 'gplay' : 'direct')).toString()
if (!(appEdition in ['direct', 'fdroid', 'gplay'])) {
    throw new GradleException('app.edition must be direct, fdroid or gplay')
}
def googlePlay = appEdition == 'gplay'
def requestedMinSdk = Integer.parseInt((project.findProperty('app.minSdk') ?: '21').toString())
def verificationOutput = project.findProperty('app.outputDir')
if (verificationOutput != null) { buildDir = file(verificationOutput) }

android {
    namespace 'xyz.waozi.arcade'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId project.findProperty('app.id') ?: (standaloneShovey ? 'xyz.waozi.shovey' : 'xyz.waozi.arcade')
        minSdk googlePlay ? Math.max(requestedMinSdk, 23) : requestedMinSdk
        targetSdk 36
        versionCode Integer.parseInt((project.findProperty('app.versionCode') ?: appRelease.sequence).toString())
        versionName project.findProperty('app.versionName') ?: appRelease.version
        manifestPlaceholders = [appLabel: standaloneShovey ? 'Shovey' : 'Arcade', appIcon: standaloneShovey ? '@mipmap/ic_launcher' : '@android:drawable/sym_def_app_icon', zxPlayer: (appCodegen == 'zx').toString(),
            nativeLaunchMode: appCodegen == 'zx' ? 'singleTask' : 'standard']
        ndk {
            abiFilters += androidAbis
        }
        externalNativeBuild {
            cmake {
                arguments '-DKRYON_DIR=' + kryonDir,
                    '-DZIRAN_DIR=' + ziranDir,
                    '-DRAYLIB_DIR=' + raylibDir,
                    '-DAPP_CODEGEN=' + appCodegen,
                    '-DSHOVEY_STANDALONE=' + (standaloneShovey ? 'ON' : 'OFF'),
                    '-DAPP_EDITION=' + appEdition
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
            if (verificationOutput != null) { buildStagingDirectory file("${verificationOutput}/cxx") }
        }
    }

    sourceSets.main.assets.srcDir "${rootProject.projectDir}/../build/entity-assets"
    // Arcade's collection and receipt, staged by make android.
    sourceSets.main.assets.srcDir "${rootProject.projectDir}/../build/${standaloneShovey ? 'android-shovey-assets' : 'android-assets'}"
    if (standaloneShovey) {
        sourceSets.main.res.srcDir "${rootProject.projectDir}/../build/android-shovey-res"
    }

    if (appCodegen == 'zx') {
        sourceSets.main.assets.srcDir "${rootProject.projectDir}/../build/android/zx-assets"
        sourceSets.debug.manifest.srcFile 'src/zx/AndroidManifest.xml'
        sourceSets.release.manifest.srcFile 'src/zx/AndroidManifest.xml'
    }

    if (googlePlay) {
        // Kryon's Play Billing class, from the Kryon checkout this build uses.
        sourceSets.main.java.srcDir "${kryonDir}/templates/droid/droid/app/src/gplay/java"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    if (googlePlay) {
        implementation 'com.android.billingclient:billing:9.1.0'
        // Billing's AndroidX libraries mix Kotlin 1.6 and 1.8 standard
        // libraries; one Kotlin version keeps their classes from colliding.
        implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    }
}

// The shared profile is a host asset, never a child of a game collection.
tasks.register('prepareEntity', Exec) {
    workingDir file('../..')
    commandLine 'python3', 'scripts/build-entity.py'
}
tasks.named('preBuild').configure { dependsOn 'prepareEntity' }
