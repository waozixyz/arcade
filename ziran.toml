[package]
name = "Arcade"
entry = "src/desktop.zi"
module_roots = ["src", "apps", "tests"]
# Kryon's Android host draws the Frame in src/app.zi.
bridge_modules = ["app"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "c47f927ca316a0494dff4f2389de3333bc8e08b4"

[install]
bin = "arcade"

# Android: Kryon's canonical host draws src/app.zi's Frame. The desktop
# build keeps its own entry, src/desktop.zi.
[tool.kryon]
entry = "src/app.zi"
default_profile = "android"

[tool.kryon.profiles.android]
backend = "android"

[tool.kryon.android]
package = "xyz.waozi.arcade"
activity = "ArcadeActivity"
min_sdk = "28"
abis = "arm64-v8a,x86_64"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "e373b8a7f8821256b86de12dd5ee05a32d373e87"

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
# Use the shared controller reviewed with the supported collection host.
ref = "f39508361f79a10a57643e97b613b34e434b9834"

# Shovey's editions and editor are available as separate downloads.
[dependencies.shovey]
git = "https://github.com/waozixyz/shovey.git"
ref = "4204ef694f54aff644ac6627e74a9fb9bcc6b643"

# Compatibility tooling runs Inner Breeze's host checks; releases check its publisher pins.
[dependencies.inbe]
git = "https://github.com/waozixyz/inbe.git"
ref = "master"

[dependencies.entity]
git = "https://github.com/waozixyz/entity.git"
ref = "908884c669ec05421373f3077d4bf5517af21bcd"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.wurm]
git = "https://github.com/waozixyz/wurm.git"
ref = "99d9ad777325e9dfc15cd8610056948819dc1f07"

[dependencies.game2d]
git = "https://github.com/kryonlabs/game2d.git"
ref = "d32e4b606ece83e8869c954f66c334f44f7b4838"

[dependencies.choano]
git = "https://github.com/waozixyz/choano.git"
ref = "528618898db605b0f2960759d49871cde2209086"

# Library art can advance independently of the tested game payload.
[dependencies.wurm_art]
git = "https://github.com/waozixyz/wurm.git"
ref = "2fa52f64eb0c29e8351b437176e896b938ece8e8"
source = true

[dependencies.daochi_client]
git = "https://github.com/ziranlang/daochi-client.git"
ref = "970d5e44b1702158cb16469892da6ff50f142427"

[dependencies.kss]
git = "https://github.com/kryonlabs/kss.git"
ref = "1cb9df183089a77c8a16448a556186f30b261a98"
