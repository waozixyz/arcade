[package]
name = "Arcade"
entry = "src/desktop.zi"
module_roots = ["src", "apps", "tests"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "master"

[install]
bin = "arcade"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "master"

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
ref = "master"

# Release and compatibility tooling runs Inner Breeze's publisher and host checks.
[dependencies.inbe]
git = "https://github.com/waozixyz/inbe.git"
ref = "master"
