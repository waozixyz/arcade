<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Arcade</title>
  <meta name="description" content="Arcade: all of Waozi's games in one place. Pick a cover, download the game and play, free in your browser.">
  <meta name="theme-color" content="#111223">
  <link rel="canonical" href="https://arcade.waozi.xyz/">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://arcade.waozi.xyz/">
  <meta property="og:title" content="Arcade">
  <meta property="og:description" content="All of Waozi's games in one place, free in your browser.">
  <meta property="og:image" content="https://arcade.waozi.xyz/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #111223; color: #f4f2ff; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #111223; font: 600 16px/1.4 system-ui, sans-serif; transition: opacity .3s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading svg { width: 64px; height: 64px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    #loading .track { width: min(280px, 70vw); height: 6px; border-radius: 3px; background: #ffffff26; overflow: hidden; }
    #loading .bar { width: 0; height: 100%; background: #ffd166; transition: width .2s ease; }
    #loading .failed { display: none; color: #ffb4a8; text-align: center; padding: 0 24px; }
    #loading.error .failed { display: block; }
    #loading.error .track { display: none; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="loading" role="status" aria-live="polite">
    <!-- MingCute game_2 gamepad, Apache-2.0 -->
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 9v3M13.5 10.5h3M7 5c1 0 3 1 5 1s4-1 5-1c3 0 7 14 3 14-3 0-4.5-4-8-4s-5 4-8 4C0 19 4 5 7 5Zm3 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"/></svg>
    <div class="track"><div class="bar"></div></div>
    <p class="failed">Arcade could not start. Reload the page to try again.</p>
  </div>
  <script>
    (function () {
      var loading = document.getElementById('loading');
      var bar = loading.querySelector('.bar');
      function failed() { loading.classList.add('error'); }
      // Arcade's Profile reports ready once the library is about to draw.
      function watch() {
        if (window.Module && Module.profileReady) { loading.classList.add('done'); return; }
        requestAnimationFrame(watch);
      }
      window.Module = {
        canvas: document.getElementById('canvas'),
        setStatus: function (text) {
          var match = /\((\d+(?:\.\d+)?)\/(\d+)\)/.exec(text || '');
          if (match) bar.style.width = Math.min(100, 100 * match[1] / match[2]) + '%';
        },
        onAbort: failed,
        onExit: function (code) { if (code !== 0) failed(); }
      };
      // The build receipt names the collection's digest and its trusted Apps
      // library; Arcade's own copy of that library goes in beside it.
      Promise.all([
        fetch('arcade.json', { cache: 'no-cache' }).then(function (response) {
          if (!response.ok) throw new Error(response.status);
          return response.text();
        }),
        fetch('apps.zx').then(function (response) {
          return response.ok ? response.arrayBuffer() : null;
        })
      ]).then(function (loaded) {
        Module.arcadeReceipt = loaded[0];
        if (loaded[1]) {
          Module.preRun = [function () { FS.writeFile('/apps.zx', new Uint8Array(loaded[1])); }];
        }
        var script = document.createElement('script');
        script.src = 'runtime.js';
        script.onerror = failed;
        document.body.appendChild(script);
        watch();
      }).catch(failed);
    })();
  </script>
</body>
</html>
