<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Arcade</title>
  <meta name="description" content="Arcade: all of Waozi's games in one place. Pick a cover, download the game and play, free in your browser.">
  <meta name="theme-color" content="#111223">
  <link rel="canonical" href="https://arcade.waozi.xyz/">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- The runtime downloads while the page fetches the collection's files. -->
  <link rel="preload" href="runtime.js?v=__ARCADE_ASSET_REVISION__" as="script">
  <link rel="preload" href="runtime.wasm?v=__ARCADE_ASSET_REVISION__" as="fetch" type="application/wasm" crossorigin>
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://arcade.waozi.xyz/">
  <meta property="og:title" content="Arcade">
  <meta property="og:description" content="All of Waozi's games in one place, free in your browser.">
  <meta property="og:image" content="https://arcade.waozi.xyz/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #111223; color: #f4f2ff; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #111223; font: 600 16px/1.4 system-ui, sans-serif; transition: opacity .3s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading svg { width: 64px; height: 64px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    #loading .track { width: min(280px, 70vw); height: 6px; border-radius: 3px; background: #ffffff26; overflow: hidden; }
    #loading .bar { width: 0; height: 100%; background: #ffd166; transition: width .2s ease; }
    #loading .failed { display: none; color: #ffb4a8; text-align: center; padding: 0 24px; }
    #loading.error .failed { display: block; }
    #loading.error .track { display: none; }
    #loading.error { opacity: 1; pointer-events: auto; }
    #loading button { border: 0; border-radius: 12px; padding: 14px 24px; background: #ffd166; color: #111223; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="loading" role="status" aria-live="polite">
    <!-- MingCute game_2 gamepad, Apache-2.0 -->
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 9v3M13.5 10.5h3M7 5c1 0 3 1 5 1s4-1 5-1c3 0 7 14 3 14-3 0-4.5-4-8-4s-5 4-8 4C0 19 4 5 7 5Zm3 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"/></svg>
    <div class="track"><div class="bar"></div></div>
    <p class="failed">Arcade stopped while opening an app. Your saved games are kept.</p>
    <button class="failed" id="retry" type="button">Return to library</button>
  </div>
  <script>
    (function () {
      var loading = document.getElementById('loading');
      var bar = loading.querySelector('.bar');
      var assetRevision = '__ARCADE_ASSET_REVISION__';
      function assetUrl(name) {
        var url = new URL(name, document.baseURI);
        url.searchParams.set('v', assetRevision);
        return url.href;
      }
      function failed() { loading.classList.remove('done'); loading.classList.add('error'); }
      document.getElementById('retry').addEventListener('click', function () { location.reload(); });
      // Keep watching after startup: a later game failure also needs recovery.
      function watch() {
        if (window.Module && Module.arcadeFailed) { failed(); return; }
        if (window.Module && Module.profileReady) loading.classList.add('done');
        requestAnimationFrame(watch);
      }
      window.Module = {
        canvas: document.getElementById('canvas'),
        locateFile: assetUrl,
        setStatus: function (text) {
          var match = /\((\d+(?:\.\d+)?)\/(\d+)\)/.exec(text || '');
          if (match) bar.style.width = Math.min(100, 100 * match[1] / match[2]) + '%';
        },
        onAbort: failed,
        onExit: function (code) { if (code !== 0) failed(); }
      };
      // Bundles travel gzip-compressed beside their plain copies: Cloudflare
      // does not compress binary files. Browsers without DecompressionStream,
      // or a missing .gz, take the plain file; null when neither exists.
      function plain(name) {
        return fetch(assetUrl(name)).then(function (response) {
          return response.ok ? response.arrayBuffer() : null;
        });
      }
      function bundle(name) {
        if (typeof DecompressionStream !== 'function') return plain(name);
        return fetch(assetUrl(name + '.gz')).then(function (response) {
          if (!response.ok) throw new Error(response.status);
          return response.arrayBuffer();
        }).then(function (packed) {
          var head = new Uint8Array(packed, 0, Math.min(2, packed.byteLength));
          // A server that already decoded it hands over the plain bytes.
          if (head[0] !== 0x1f || head[1] !== 0x8b) return packed;
          return new Response(new Blob([packed]).stream()
            .pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
        }).catch(function () { return plain(name); });
      }
      function hex(buffer) {
        return Array.prototype.map.call(new Uint8Array(buffer), function (byte) {
          return (byte < 16 ? '0' : '') + byte.toString(16);
        }).join('');
      }
      function file(name) {
        return fetch(assetUrl(name)).then(function (response) {
          if (!response.ok) throw new Error(response.status);
          return response.arrayBuffer();
        });
      }
      // The library's pictures come from this site, never api.waozi.xyz:
      // small copies of the collection's signed art (library.json), each
      // checked against its digest, or the exact art bundle for a browser
      // that cannot draw WebP or check them. The host verifies that bundle.
      function library() {
        return fetch(assetUrl('library.json')).then(function (response) {
          return response.ok ? response.json() : null;
        }).then(function (listing) {
          if (!listing) return null;
          var paths = Object.keys(listing.pictures);
          return Promise.all(paths.map(function (path) {
            var picture = listing.pictures[path];
            return file(picture.file).then(function (bytes) {
              return crypto.subtle.digest('SHA-256', bytes).then(function (digest) {
                if (hex(digest) !== picture.sha256) throw new Error(path);
                return bytes;
              });
            });
          })).then(function (copies) {
            var webp = paths.findIndex(function (path) { return /\.webp$/.test(listing.pictures[path].file); });
            var drawn = webp < 0 ? Promise.resolve() : createImageBitmap(new Blob([copies[webp]])).then(function (bitmap) { bitmap.close(); });
            return drawn.then(function () { return { art: listing.art, paths: paths, copies: copies }; });
          }).catch(function () {
            return file('library/' + listing.art + '.zx').then(function (bundle) {
              return { art: listing.art, bundle: bundle };
            });
          });
        }).catch(function () { return null; });
      }
      function writeLibrary(pictures) {
        if (pictures.bundle) {
          FS.mkdirTree('/packages');
          FS.writeFile('/packages/' + pictures.art + '.zx', new Uint8Array(pictures.bundle));
          return;
        }
        pictures.paths.forEach(function (path, index) {
          var name = '/library/' + pictures.art + '/' + path;
          FS.mkdirTree(name.slice(0, name.lastIndexOf('/')));
          FS.writeFile(name, new Uint8Array(pictures.copies[index]));
        });
      }
      // The build receipt names the collection's digest and its trusted Apps
      // library; Arcade's own copy of that library goes in beside it.
      Promise.all([
        fetch(assetUrl('arcade.json'), { cache: 'no-cache' }).then(function (response) {
          if (!response.ok) throw new Error(response.status);
          return response.text();
        }),
        bundle('apps.zx'),
        bundle('runtime.data'),
        library()
      ]).then(function (loaded) {
        Module.arcadeReceipt = loaded[0];
        Module.preRun = [function () {
          if (loaded[1]) FS.writeFile('/apps.zx', new Uint8Array(loaded[1]));
          if (loaded[3]) writeLibrary(loaded[3]);
        }];
        // The runtime's file package, already here, is not fetched again.
        if (loaded[2]) {
          Module.getPreloadedPackage = function () { return loaded[2]; };
        }
        function start() {
          var script = document.createElement('script');
          script.src = assetUrl('runtime.js');
          script.onerror = failed;
          document.body.appendChild(script);
          watch();
        }
        // One sign-in for every waozi.xyz site: account.waozi.xyz hands over
        // the shared profile before Arcade starts, or Arcade starts without it.
        var started = false;
        function go() { if (!started) { started = true; start(); } }
        var shared = document.createElement('script');
        shared.src = 'https://account.waozi.xyz/share.js';
        shared.onload = function () { WaoziAccount.attach(Module, 2500).then(go, go); };
        shared.onerror = go;
        setTimeout(go, 4000);
        document.head.appendChild(shared);
      }).catch(failed);
    })();
  </script>
</body>
</html>
