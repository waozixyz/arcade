name: Website

# Every push to master publishes site/ to https://arcade.waozi.xyz.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcade-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: cloudflare-pages
      url: https://arcade.waozi.xyz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check the site's files
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          site = Path('site')
          page = (site / 'index.html').read_text()
          local = {path.lstrip('/') for path in re.findall(r'(?:src|href)="(/[^"#?]+)"', page) if path != '/'}
          missing = sorted(path for path in local if not (site / path).is_file())
          assert not missing, f'Missing site files: {missing}'
          print('All', len(local), 'local files referenced by index.html exist.')
          PY
      - name: Prepare the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cloudflare-site.py prepare
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=arcade --branch=master --commit-hash=${{ github.sha }}
      - name: Connect arcade.waozi.xyz
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cloudflare-site.py connect
