name: Website

# https://arcade.waozi.xyz runs Arcade in the browser: the latest published
# arcade.zx, the same one Inner Breeze downloads, with Arcade's own host
# compiled to WebAssembly. Every push to master and every Arcade release,
# manual or automatic, rebuilds and publishes it.
on:
  push:
    branches: [master]
  workflow_run:
    workflows: [Arcade node release, Game updates]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# A running build finishes; only the newest waiting one follows it.
concurrency:
  group: arcade-site
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: waozixyz/arcade
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: waozixyz/arcade
          ref: master
          fetch-depth: 0
      - name: Read the locked toolchain
        id: toolchain
        run: |
          python3 -c 'import json,os; open(os.environ["GITHUB_OUTPUT"],"a").write("commit="+json.load(open("ziran.lock"))["toolchain"]["commit"]+"\n")'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ziranlang/ziran
          ref: ${{ steps.toolchain.outputs.commit }}
          path: ziranlang/ziran
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        working-directory: .
        run: sh ziranlang/ziran/scripts/ci_packages.sh build-essential cmake pkg-config python3-pil
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.6'
          actions-cache-folder: emsdk-cache
      - name: Build the locked toolchain and fetch packages
        run: |
          make -j2 -C ../../ziranlang/ziran
          echo "$GITHUB_WORKSPACE/ziranlang/ziran/build/bin" >> "$GITHUB_PATH"
          printf '[overrides]\nziran = "../../ziranlang/ziran"\n' > ziran.local.toml
          ../../ziranlang/ziran/build/bin/ziran fetch
      - name: Download the published Arcade
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo waozixyz/arcade --limit 50 --json tagName,isDraft \
            -q '[.[] | select(.isDraft | not) | .tagName | select(startswith("node-arcade-"))][0]')
          test -n "$tag"
          mkdir -p build/published
          # Its game archive holds the library art the site serves itself.
          gh release download "$tag" --repo waozixyz/arcade --pattern arcade.zx \
            --pattern arcade.games.tar --dir build/published
          # The Apps library that release packs, by the digest its own commit trusts.
          git show "$tag:apps-controller.sha256" > build/published/apps-controller.sha256
          echo "version=${tag#node-arcade-}" >> "$GITHUB_OUTPUT"
      - name: Build the browser edition
        run: |
          python3 tests/web_library_art_test.py
          python3 scripts/build-entity.py
          python3 scripts/build-apps.py --output build/apps-ui
          python3 scripts/build-web.py --bundle build/published/arcade.zx \
            --controller-sha256 "$(cat build/published/apps-controller.sha256)" \
            --version '${{ steps.published.outputs.version }}'
          rm -f build/web-site/runtime.html
      - name: Open Arcade in a private browser
        run: |
          export CHROMIUM="$(command -v google-chrome || command -v chromium)"
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS node tests/web_site_test.mjs build/web-site
      - uses: actions/upload-artifact@v4
        with:
          name: arcade-site
          path: waozixyz/arcade/build/web-site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: cloudflare-pages
      url: https://arcade.waozi.xyz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
      - uses: actions/download-artifact@v4
        with:
          name: arcade-site
          path: build/web-site
      - name: Prepare the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cloudflare-site.py prepare
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web-site --project-name=arcade --branch=master --commit-hash=${{ github.sha }}
      - name: Connect arcade.waozi.xyz
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cloudflare-site.py connect
