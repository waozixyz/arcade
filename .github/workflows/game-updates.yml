name: Game updates

# Arcade follows its games by itself. When a game package (Shovey, Apfelwurm)
# publishes a GitHub release, this pins Arcade to that release, adds the
# game's notes to Arcade's catalog changelog, builds and checks the collection,
# commits the new catalog version and attaches its catalog and game archive to
# the node-arcade-VERSION release. Inner Breeze's node follower then signs
# that release and publishes it to Waozi's node, where Arcade downloads games.
# A game's release workflow starts this at once; the timer is the fallback,
# since GitHub runs scheduled workflows hours late.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: arcade-node-release
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: waozixyz/arcade
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: waozixyz/arcade
      - name: Check release following
        run: |
          python3 tests/game_updates_test.py
          python3 tests/catalog_versions_test.py
      - name: Find newer game releases
        id: updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/follow-game-releases.py check
          if [ "$(python3 -c 'import json; print(len(json.load(open("build/game-updates.json"))))')" = 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Arcade already pins every game's latest release."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock = json.load(open('ziran.lock'))
          print('toolchain=' + lock['toolchain']['commit'])
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.updates.outputs.changed == 'true'
        with:
          repository: ziranlang/ziran
          ref: ${{ steps.updates.outputs.toolchain }}
          path: ziranlang/ziran
      - name: Install build dependencies
        if: steps.updates.outputs.changed == 'true'
        working-directory: .
        run: sh ziranlang/ziran/scripts/ci_packages.sh build-essential python3-pil python3-cryptography
      - name: Build the locked toolchain and pin game dependencies
        id: pin
        if: steps.updates.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make -j2 -C ../../ziranlang/ziran
          echo "$GITHUB_WORKSPACE/ziranlang/ziran/build/bin" >> "$GITHUB_PATH"
          python3 scripts/follow-game-releases.py pin --ziran ../../ziranlang/ziran/build/bin/ziran
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock = json.load(open('ziran.lock'))
          shovey = lock['root']['dependencies']['shovey']
          print('shovey=' + next(p['commit'] for p in lock['packages'] if p['id'] == shovey))
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.updates.outputs.changed == 'true'
        with:
          repository: waozixyz/shovey
          ref: ${{ steps.pin.outputs.shovey }}
          path: waozixyz/shovey
      - name: Fetch the updated packages
        if: steps.updates.outputs.changed == 'true'
        run: |
          # The game is generated in its own checkout at the pinned release.
          printf '[overrides]\nshovey = "../shovey"\nziran = "../../ziranlang/ziran"\n' > ziran.local.toml
          ../../ziranlang/ziran/build/bin/ziran fetch
      - name: Write the Arcade release
        id: release
        if: steps.updates.outputs.changed == 'true'
        run: |
          python3 scripts/follow-game-releases.py changelog --ziran ../../ziranlang/ziran/build/bin/ziran
          sh update_version.sh --catalog
          python3 scripts/follow-game-releases.py art
          echo "version=$(cat catalog/VERSION)" >> "$GITHUB_OUTPUT"
          head -12 catalog/CHANGELOG.md
      - name: Build and check the collection
        if: steps.updates.outputs.changed == 'true'
        run: |
          make -C ../shovey levels landscape
          make collection
          python3 tests/collection_test.py
          python3 tests/publisher_test.py
      - name: Commit the release
        id: commit
        if: steps.updates.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name Waozi
          git config user.email waozi@proton.me
          git add ziran.toml ziran.lock catalog/CHANGELOG.md catalog/VERSION apps/versions.json assets/arcade/library
          git commit -q -m "Release Arcade catalog $VERSION with the latest game releases"
          git push origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Attach the checked catalog and game archive
        if: steps.updates.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -eu
          gh release create "node-arcade-$VERSION" build/node-apps/arcade.zx build/node-apps/arcade.games.tar build/games/wurm.zx \
            --target "$SHA" --title "Arcade $VERSION" \
            --notes 'Arcade downloads the selected game separately and preserves earned progress.'
          echo "Arcade $VERSION is ready for the node: sha256 $(sha256sum build/node-apps/arcade.zx | cut -d' ' -f1)"
      # Breeze's node follower signs this release and publishes it to the
      # node now, not at its next timer. RELEASE_FOLLOW_TOKEN may only start
      # workflows in Arcade and Breeze; the follower takes no input and
      # checks Arcade's newest release itself. Without it the timer follows.
      - name: Start the node follower
        if: steps.updates.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_FOLLOW_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No RELEASE_FOLLOW_TOKEN: Breeze's node follower picks this release up on its timer."
            exit 0
          fi
          gh workflow run node-app-follow.yml -R waozixyz/breeze --ref master
